<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Inventario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo" id="logoEmpresa">&#x1F4E6;</div>
                    <div class="company-info">
                        <h1 id="nombreEmpresaHeader">Mi Empresa</h1>
                        <p>Sistema de Inventario</p>
                    </div>
                </div>
                <div class="stats">
                    <p>Productos: <strong id="totalProductos">0</strong></p>
                    <p>Valor Total: <strong>$<span id="valorTotal">0</span></strong></p>
                </div>
            </div>
        </div>
    </header>

    <!--Navegación Principal-->

    <div class="card">
        <div class="tabs">
            <button class="tab-button active" onclick="mostrarTab('productos')" id="tab-productos">
                &#x1F4E6;Productos
            </button>

            <button class="tab-button" onclick="mostrarTab('agregar')" id="tab-agregar">
                &#x2795;Agregar Productos
            </button>
            
            <button class="tab-button" onclick="mostrarTab('scanner')" id="tab-scanner">
                &#x1F4E0;Escanear Código
            </button>
        </div>

        <!--Contenido de Pestañas-->

        <div class="tab-content active" id="content-productos">
            <div class="search-container">
                <input type="text" id="buscarProducto" placeholder="Buscar producto..." class="search-input">
                <button onclick="buscarProductos()" class="btn btn-primary">
                    &#x1F50D;Buscar
                </button>
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <!-- Los productos se cargarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="tab-content" id="content-agregar">
            <h3>Agregar Nuevo Producto</h3>
            <form id="formProducto">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Código de Barras</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="codigoBarras" class="form-input" placeholder="Escanear o ingresar manualmente">
                            <button type="button" onclick="abrirScannerRapido()" class="btn btn-primary">
                                <span class="icon icon-scan"></span>
                                Escanear
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nombre del producto</label>
                        <input type="text" id="nombreProducto" required class="form-input">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Categoría</label>
                        <select id="categoriaProducto" class="form-select">
                            <option value="Electronico">Electrónicos</option>
                            <option value="Ropa">Ropa</option>
                            <option value="Hogar">Hogar</option>
                            <option value="Deportes">Deportes</option>
                            <option value="Libros">Libros</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Stock Inicial</label>
                        <input type="number" id="stockProducto" min="0" required class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Precio Unitario</label>
                        <input type="number" id="precioProducto" step="0.01" min="0" required class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Stock Mínimo</label>
                        <input type="number" id="stockMinimo" min="0" value="5" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Descripción</label>
                    <textarea id="descripcionProducto" class="form-textarea"></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-success">
                        <span class="icon icon-save"></span>
                        Guardar
                    </button>
                    <button type="button" onclick="limpiarFormulario()" class="btn btn-secondary">
                        Limpiar
                    </button>
                </div>
            </form>
        </div>

        <div class="tab-content" id="content-scanner">
            <h3>Escanear Código de Barras</h3>
            <div class="scanner-container">
                <p class="scanner-help">Permite el acceso a la cámara y apunta al código. Se admiten EAN, UPC, Code 128, Code 39, ITF y QR.</p>
                <div id="reader" class="scanner-box"></div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button onclick="iniciarScanner()" id="btnIniciarScanner" class="btn btn-primary">
                        Iniciar Escáner
                    </button>
                    <button onclick="detenerScanner()" id="btnDetenerScanner" class="btn btn-danger" style="display: none;">
                        Detener Escáner
                    </button>
                </div>
                <div id="resultadoScan" class="scan-result">
                    <p><strong>Código escaneado:</strong></p>
                    <div id="codigoEscaneado" class="scanned-code"></div>
                    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                        <button onclick="usarCodigoEscaneado()" class="btn btn-success">
                            Usar en Formulario
                        </button>
                        <button onclick="buscarProductoPorCodigo()" class="btn btn-primary">
                            Buscar Producto
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="app.js"></script>
</html>
